modLoader="javafml"
loaderVersion="${loader_version}"
issueTrackerURL="https://github.com/Viking602/ProjectE-Reforged/issues"
license="MIT"

[[mods]]
  modId="projecte"
  version="${version}"
  displayName="ProjectE Reforged"
  displayURL="https://github.com/Viking602/ProjectE-Reforged"
  logoFile="logo.png"
  authors="ProjectE contributors"
  credits="Based on ProjectE: https://github.com/sinkillerj/ProjectE"
  description='''EMC transmutation for Minecraft 26.1.2. Turn spare items into EMC and use it to create the items you need. Includes transmutation tables, collectors, condensers, matter tools, and alchemical equipment.'''

[[dependencies.projecte]]
  modId="minecraft"
  type="required"
  versionRange="${mc_version}"
  side="BOTH"
[[dependencies.projecte]]
  modId="neoforge"
  type="required"
  versionRange="${neo_version}"
  side="BOTH"

[[dependencies.projecte]]
modId="mekanism"
type="incompatible"
reason="Requires an update to support changes to recipe mappers"
versionRange="[,10.7.8]"
side="BOTH"
